name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      target:
        description: 'Build target'
        required: true
        default: 'release'
        type: choice
        options:
          - 'release'
          - 'deps'
          - 'gcc'
          - 'component'
          - 'meta'
      component:
        description: 'Component name (required when target is component)'
        required: false
        default: ''
        type: string
      release_tag:
        description: 'Release version tag'
        required: false
        default: '14.3.1'
        type: string
      publish_release:
        description: 'Publish to GitHub Releases (target must be release)'
        required: false
        default: false
        type: boolean
      prerelease:
        description: 'Mark GitHub Release as pre-release'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  build:
    name: Build devtoolset-14
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker builder image
        uses: docker/build-push-action@v6
        with:
          context: .ci
          file: .ci/Dockerfile.dts14
          load: true
          tags: dts14-builder:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Configure build parameters
        id: params
        run: |
          set -eu
          if [ "${{ github.event_name }}" = "push" ]; then
            RAW_TAG="${GITHUB_REF_NAME}"
            case "$RAW_TAG" in
              v*) TAG_NAME="$RAW_TAG"; RELEASE_TAG="${RAW_TAG#v}" ;;
              *)  TAG_NAME="v$RAW_TAG"; RELEASE_TAG="$RAW_TAG" ;;
            esac
            TARGET="release"
            PUBLISH="true"
            PRERELEASE="false"
            COMPS=""
            DO_RELEASE="1"
          else
            TARGET="${{ inputs.target }}"
            RAW_TAG="${{ inputs.release_tag }}"
            case "$RAW_TAG" in
              v*) TAG_NAME="$RAW_TAG"; RELEASE_TAG="${RAW_TAG#v}" ;;
              *)  TAG_NAME="v$RAW_TAG"; RELEASE_TAG="$RAW_TAG" ;;
            esac
            PUBLISH="${{ inputs.publish_release }}"
            PRERELEASE="${{ inputs.prerelease }}"
            case "$TARGET" in
              release)
                COMPS=""
                DO_RELEASE="1"
                ;;
              deps)
                COMPS="dwz ltrace strace make annobin elfutils binutils valgrind dyninst systemtap gdb"
                DO_RELEASE="0"
                ;;
              gcc)
                COMPS="gcc"
                DO_RELEASE="0"
                ;;
              meta)
                COMPS="meta"
                DO_RELEASE="0"
                ;;
              component)
                COMPS="${{ inputs.component }}"
                if [ -z "$COMPS" ]; then
                  echo "Error: target is 'component' but no component was specified" >&2
                  exit 1
                fi
                DO_RELEASE="0"
                ;;
              *)
                echo "Unknown target: $TARGET" >&2
                exit 1
                ;;
            esac
          fi

          echo "target=$TARGET" >> "$GITHUB_OUTPUT"
          echo "release_tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "tag_name=$TAG_NAME" >> "$GITHUB_OUTPUT"
          echo "publish=$PUBLISH" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"
          echo "comps=$COMPS" >> "$GITHUB_OUTPUT"
          echo "do_release=$DO_RELEASE" >> "$GITHUB_OUTPUT"

      - name: Build RPMs
        run: |
          mkdir -p out/rpms out/srpms out/logs
          docker run --rm \
            -v "${{ github.workspace }}:/workspace" \
            -v "${{ github.workspace }}/out:/out" \
            -e RELEASE_TAG="${{ steps.params.outputs.release_tag }}" \
            -e RELEASE="${{ steps.params.outputs.do_release }}" \
            -e COMPS="${{ steps.params.outputs.comps }}" \
            dts14-builder:latest bash -c "bash /workspace/devtoolset-14/releng/ci-release.sh"

      - name: Fix output directory permissions
        if: always()
        run: |
          if [ -d out ]; then
            sudo chown -R "$(id -u):$(id -g)" out || true
          fi

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-${{ steps.params.outputs.target }}-${{ github.run_id }}
          path: out/logs/
          if-no-files-found: ignore

      - name: Upload RPM artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: rpms-${{ steps.params.outputs.target }}-${{ github.run_id }}
          path: |
            out/rpms/**/*.rpm
            out/srpms/**/*.rpm
          if-no-files-found: ignore

      - name: Publish GitHub Release
        if: success() && steps.params.outputs.publish == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.params.outputs.tag_name }}
          name: devtoolset-14 ${{ steps.params.outputs.release_tag }}
          draft: false
          prerelease: ${{ steps.params.outputs.prerelease == 'true' }}
          files: |
            out/devtoolset-14-*.tar.gz
            out/sha256sums.txt
          generate_release_notes: true
