name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Devtoolset version (14 or 16)'
        required: true
        default: '16'
        type: choice
        options:
          - '16'
          - '14'
      target:
        description: 'Build target'
        required: true
        default: 'release'
        type: choice
        options:
          - 'release'
          - 'deps'
          - 'prereqs'
          - 'gcc'
          - 'component'
          - 'meta'
      component:
        description: 'Component name (required when target is component)'
        required: false
        default: ''
        type: string
      release_tag:
        description: 'Release version tag (default: 16.2.1 for DTS16, 14.3.1 for DTS14)'
        required: false
        default: ''
        type: string
      publish_release:
        description: 'Publish to GitHub Releases'
        required: false
        default: false
        type: boolean
      prerelease:
        description: 'Mark GitHub Release as pre-release'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  build:
    name: Build devtoolset
    runs-on: ubuntu-26.04
    timeout-minutes: 360

    steps:
      - name: Checkout repository
        uses: actions/checkout@main

      - name: Configure build parameters
        id: params
        run: |
          set -eu
          if [ "${{ github.event_name }}" = "push" ]; then
            RAW_TAG="${GITHUB_REF_NAME}"
            case "$RAW_TAG" in
              v14*) DTS_VERSION="14" ;;
              *)    DTS_VERSION="16" ;;
            esac
            case "$RAW_TAG" in
              v*) TAG_NAME="$RAW_TAG"; RELEASE_TAG="${RAW_TAG#v}" ;;
              *)  TAG_NAME="v$RAW_TAG"; RELEASE_TAG="$RAW_TAG" ;;
            esac
            TARGET="release"
            PUBLISH="true"
            PRERELEASE="false"
            COMPS=""
            DO_RELEASE="1"
            BUNDLE_PREFIX="full_"
          else
            DTS_VERSION="${{ inputs.version }}"
            TARGET="${{ inputs.target }}"
            RAW_TAG="${{ inputs.release_tag }}"
            if [ -z "$RAW_TAG" ]; then
              if [ "$DTS_VERSION" = "16" ]; then
                RAW_TAG="16.2.1"
              else
                RAW_TAG="14.3.1"
              fi
            fi
            case "$RAW_TAG" in
              v*) TAG_NAME="$RAW_TAG"; RELEASE_TAG="${RAW_TAG#v}" ;;
              *)  TAG_NAME="v$RAW_TAG"; RELEASE_TAG="$RAW_TAG" ;;
            esac
            PUBLISH="${{ inputs.publish_release }}"
            PRERELEASE="${{ inputs.prerelease }}"
            case "$TARGET" in
              release)
                COMPS=""
                BUNDLE_PREFIX="full_"
                ;;
              deps)
                COMPS="dwz ltrace strace make annobin elfutils binutils valgrind dyninst systemtap gdb"
                BUNDLE_PREFIX="dep_"
                ;;
              prereqs)
                COMPS="xxhash babeltrace boost183 autoconf"
                BUNDLE_PREFIX="prereqs_"
                ;;
              gcc)
                COMPS="gcc"
                BUNDLE_PREFIX="gcc_"
                ;;
              meta)
                COMPS="meta"
                BUNDLE_PREFIX="meta_"
                ;;
              component)
                COMPS="${{ inputs.component }}"
                if [ -z "$COMPS" ]; then
                  echo "Error: target is 'component' but no component was specified" >&2
                  exit 1
                fi
                if [ "$COMPS" = "boost" ]; then
                  COMPS="boost183"
                fi
                BUNDLE_PREFIX="${COMPS}_"
                ;;
              *)
                echo "Unknown target: $TARGET" >&2
                exit 1
                ;;
            esac
            if [ "$PUBLISH" = "true" ] || [ "$TARGET" = "release" ]; then
              DO_RELEASE="1"
            else
              DO_RELEASE="0"
            fi
          fi

          echo "dts_version=$DTS_VERSION" >> "$GITHUB_OUTPUT"
          echo "target=$TARGET" >> "$GITHUB_OUTPUT"
          echo "release_tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "tag_name=$TAG_NAME" >> "$GITHUB_OUTPUT"
          echo "publish=$PUBLISH" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"
          echo "comps=$COMPS" >> "$GITHUB_OUTPUT"
          echo "do_release=$DO_RELEASE" >> "$GITHUB_OUTPUT"
          echo "bundle_prefix=$BUNDLE_PREFIX" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@master

      - name: Build Docker builder image
        uses: docker/build-push-action@master
        with:
          context: .ci
          file: .ci/Dockerfile.dts${{ steps.params.outputs.dts_version }}
          load: true
          tags: dts${{ steps.params.outputs.dts_version }}-builder:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build RPMs
        run: |
          mkdir -p out/rpms out/srpms out/logs
          docker run --rm \
            -v "${{ github.workspace }}:/workspace" \
            -v "${{ github.workspace }}/out:/out" \
            -e RELEASE_TAG="${{ steps.params.outputs.release_tag }}" \
            -e RELEASE="${{ steps.params.outputs.do_release }}" \
            -e BUNDLE_PREFIX="${{ steps.params.outputs.bundle_prefix }}" \
            -e COMPS="${{ steps.params.outputs.comps }}" \
            dts${{ steps.params.outputs.dts_version }}-builder:latest \
            bash -c "bash /workspace/devtoolset-${{ steps.params.outputs.dts_version }}/releng/ci-release.sh"

      - name: Fix output directory permissions
        if: always()
        run: |
          if [ -d out ]; then
            sudo chown -R "$(id -u):$(id -g)" out || true
          fi

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@main
        with:
          name: build-logs-dts${{ steps.params.outputs.dts_version }}-${{ steps.params.outputs.target }}-${{ github.run_id }}
          path: out/logs/
          if-no-files-found: ignore

      - name: Upload RPM artifacts
        if: success()
        uses: actions/upload-artifact@main
        with:
          name: rpms-dts${{ steps.params.outputs.dts_version }}-${{ steps.params.outputs.target }}-${{ github.run_id }}
          path: |
            out/rpms/**/*.rpm
            out/srpms/**/*.rpm
          if-no-files-found: ignore

      - name: Publish GitHub Release
        if: success() && steps.params.outputs.publish == 'true'
        uses: softprops/action-gh-release@master
        with:
          tag_name: ${{ steps.params.outputs.tag_name }}
          name: devtoolset-${{ steps.params.outputs.dts_version }} ${{ steps.params.outputs.release_tag }}
          draft: false
          prerelease: ${{ steps.params.outputs.prerelease == 'true' }}
          fail_on_unmatched_files: true
          files: |
            out/*devtoolset-*.tar.gz
            out/*sha256sums.txt
          generate_release_notes: true
